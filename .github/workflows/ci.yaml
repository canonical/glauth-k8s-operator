name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
   workflow_dispatch:
   push:
     branches:
     - "main"
     - "release-**"
     - "track/**"
     paths-ignore:
     - "terraform/**"
   pull_request:
     branches:
     - "*"
     paths-ignore:
     - "terraform/**"

jobs:
  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@bacce5fe2bd598f8daa69c64438fb872334e2d0a # v1.18.0
    with:
      container-name: "glauth"
      use-charmcraftcache: false
      node-size: large
      tox-integration-test-targets: "build-prerequisites,integration"
      base: "26.04"
      k8s-channel: "1.35-strict/stable"
